# explo stack: ListenBrainz discovery playlists downloaded from YouTube.
# The image's start script upgrades yt-dlp with pip on every start and
# nightly from cron, so Python and its packages are kept whole.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/explo"
SOURCE_IMAGE="ghcr.io/lumepart/explo:v1.2.0"
SLIM_IMAGE="slim/explo:v1.2.0"
PULL_SOURCE=0   # pinned version; nothing newer to pull under this tag
WEB_PORT=17288  # live container uses 7288
# Same environment as the stack; the image switches to PUID itself.
ENVS=(PUID=1000 PGID=1000 TZ=America/Chicago WEB_UI=true "WEB_ADDR=:$WEB_PORT")
MOUNTS=("$WORK_ROOT/explo/explo.env:/opt/explo/.env"
    "$WORK_ROOT/explo/config:/opt/explo/config"
    "$WORK_ROOT/explo/downloads:/music/library/explo"
    "$WORK_ROOT/explo/playlists:/playlists")
BASE="http://127.0.0.1:$WEB_PORT"
PY=/usr/local/lib/python3.12
MINT_EXTRA=(--include-path "$PY" --include-path /usr/local/bin
    --exclude-pattern "$PY/test/**" --exclude-pattern "$PY/idlelib/**"
    --exclude-pattern "$PY/tkinter/**" --exclude-pattern "$PY/turtledemo/**"
    --include-path /usr/share/zoneinfo --include-path /etc/crontabs
    --include-bin /usr/bin/ffmpeg --include-bin /usr/bin/ffprobe
    --include-exe crond --include-exe crontab --include-exe su-exec
    --include-exe groupmod --include-exe usermod --include-shell)

# Downloads start empty, so a run really downloads (yt-dlp, ffmpeg, cover
# art) instead of finding every track already on disk.
prepare() {
    mkdir -p "$WORK/downloads" "$WORK/playlists"
    cp -p "$STACK/data/explo.env" "$WORK/explo.env"
    cp -a "$STACK/data/config" "$WORK/config"
}

wait_ready() { http_up "$BASE/"; }

# One full discovery run, the same command the cron job runs. Prints a
# summary that does not depend on which songs ListenBrainz picked.
explo_run() {
    docker exec "$CONTAINER" sh -c 'cd /opt/explo && su-exec explo ./explo --config /opt/explo/.env --playlist weekly-exploration' \
        >"$WORK/run.log" 2>&1 || echo "explo run exit code $?"
    local tracks
    tracks="$(find "$WORK/downloads" -name '*.mp3' | wc -l)"
    echo "downloaded tracks > 10: $((tracks > 10))"
    echo "playlists: $(find "$WORK/playlists" -name '*.m3u' | wc -l)"
    # grep -c exits 1 when it counts zero, which is the good case.
    echo "run log error lines: $(grep -ciE 'traceback|no such file|not found|exec format' "$WORK/run.log" || true)"
}

requests() {
    http_status "$BASE" /
    # The web UI's JavaScript names its API routes; fetch each GET route.
    local route
    for route in $(http_body "$BASE" / | grep -oE '/api/[a-zA-Z0-9/_-]+' | sort -u); do
        http_status "$BASE" "$route"
    done
    http_status "$BASE" /nope
    docker exec "$CONTAINER" ./explo --version | sed 's/[0-9.]\+/N/g'
    docker exec "$CONTAINER" yt-dlp --version | sed 's/[0-9.]\+/N/g'
    docker exec "$CONTAINER" crontab -l | sed 's/^[^ ]* [^ ]* [^ ]* [^ ]* [^ ]* //' | cut -c1-40
}

probe() {
    requests
    explo_run
    # The nightly cron job: upgrade yt-dlp with pip (exercises pip itself).
    docker exec "$CONTAINER" sh -c 'pip install --disable-pip-version-check --root-user-action=ignore --no-cache-dir --upgrade yt-dlp' >/dev/null
}

check() {
    requests
    explo_run
}
