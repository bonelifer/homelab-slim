# mympd-radio-scrobble stack: scrobbles radio songs played in MPD to Last.fm.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/mympd-radio-scrobble"
SOURCE_IMAGE="ghcr.io/bonelifer/mympd-lastfm-setup:latest"
SLIM_IMAGE="slim/mympd-lastfm-setup:latest"
RUN_USER="1000:1000"
FAKE_PORT=16600        # scripted playback, dry run
FAKE_STOP_PORT=16601   # stopped player, real mode (never sends anything)
MOUNTS=("$WORK_ROOT/mympd-radio-scrobble/setup-lastfm.cfg:/config/setup-lastfm.cfg:ro"
    "$WORK_ROOT/mympd-radio-scrobble/state:/state")
# A dry run against a fake MPD: the real MPD and Last.fm are never used.
CMD='["--config", "/config/setup-lastfm.cfg", "--state", "/state/attempts.sqlite3", "--port", "16600", "--dry-run"]'
python_safety_includes /usr/local/lib/python3.13

prepare() {
    local config
    config="$(sed -n 's/^RADIO_LASTFM_CONFIG=//p' "$STACK/.env")"
    mkdir -p "$WORK/state"
    cp -p "$config" "$WORK/setup-lastfm.cfg"
    cp -p "$STACK/data/attempts.sqlite3" "$WORK/state/"
    # SomaFM is only recognized when the title matches its live feed.
    local soma
    soma="$(curl -s --max-time 10 https://api.somafm.com/songs/groovesalad.json |
        json_get 'd["songs"][0]["artist"] + " - " + d["songs"][0]["title"]')"
    SOMA_TITLE="$soma" python3 - "$WORK/scenario.json" "$WORK/stopped.json" <<'PY'
import json, os, sys
play = lambda songid: {"state": "play", "songid": str(songid)}
steps = [
    {"seconds": 5, "status": {"state": "stop"}, "song": {}},
    {"seconds": 10, "status": play(1), "song": {
        "file": "https://ice1.somafm.com/groovesalad-128-mp3",
        "Title": os.environ["SOMA_TITLE"]}},
    {"seconds": 10, "status": play(2), "song": {
        "file": "https://stream.revma.ihrhls.com/zc185#mympd-iheart=185",
        "Title": 'text="Test Song" song_spot="M" artist="Test Band" length="00:03:30"'}},
    {"seconds": 10, "status": play(3), "song": {
        "file": "http://127.0.0.1:18769/stream/123",
        "Artist": "Test Artist", "Title": "Test Title", "Album": "Test Album"}},
    {"seconds": 8, "status": play(4), "song": {
        "file": "http://127.0.0.1:18765/stream/nosuchstation", "Title": "Some - Thing"}},
    {"seconds": 8, "status": play(5), "song": {
        "file": "http://example.invalid/s#mympd-tunein=s123&name=Test",
        "Title": "Artist - Song", "Genre": "Talk"}},
    {"seconds": 6, "status": {"state": "pause", "songid": "5"}, "song": {"Title": "x"}},
    {"seconds": 1, "status": {"state": "stop"}, "song": {}},
]
json.dump(steps, open(sys.argv[1], "w"))
json.dump([{"seconds": 1, "status": {"state": "stop"}, "song": {}}], open(sys.argv[2], "w"))
PY
    python3 "$SCRIPT_DIR/tools/fake-mpd.py" -p "$FAKE_PORT" -s "$WORK/scenario.json" &
    echo $! >"$WORK_ROOT/$PROFILE.fake.pid"
    python3 "$SCRIPT_DIR/tools/fake-mpd.py" -p "$FAKE_STOP_PORT" -s "$WORK/stopped.json" &
    echo $! >>"$WORK_ROOT/$PROFILE.fake.pid"
}

cleanup() {
    local pid
    if [[ -f "$WORK_ROOT/$PROFILE.fake.pid" ]]; then
        while read -r pid; do kill "$pid" 2>/dev/null || true; done <"$WORK_ROOT/$PROFILE.fake.pid"
        rm -f "$WORK_ROOT/$PROFILE.fake.pid"
    fi
}

wait_ready() { docker logs "$CONTAINER" 2>&1 | grep -q . || sleep 3; }

# Let the scenario play out (58 s), then summarize what the scrobbler did.
exercise() {
    # Real (non-dry) mode against a stopped player: opens the SQLite
    # state file, but never contacts Last.fm.
    docker exec -d "$CONTAINER" python3 -u /app/radio-scrobble.py \
        --config /config/setup-lastfm.cfg --state /state/attempts.sqlite3 --port "$FAKE_STOP_PORT"
    docker exec "$CONTAINER" python3 /app/radio-scrobble.py --help | head -n 1
    sleep 60
    docker logs "$CONTAINER" 2>&1 | sort | uniq -c | sed 's/^ *//'
}
probe() { exercise; }
check() { exercise; }
