# mpd-listening-tools stack: listening sessions, album mixes and radio
# handoff for myMPD. Runs the stock python:3.13-slim image with the
# scripts bind-mounted in, so the slim image holds only Python itself.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/mpd-listening-tools"
SOURCE_IMAGE="python:3.13-slim"
SLIM_IMAGE="slim/mpd-listening-tools:latest"
RUN_USER="1000:1000"
PORT=18870       # live bridge uses 18770
MPD_PORT=6611    # throwaway MPD: these actions change the queue
ENV_FILE="$STACK/.env"
MOUNTS=("$STACK/bridge.py:/app/bridge.py:ro" "$STACK/services.py:/app/services.py:ro"
    "$STACK/listening.py:/app/listening.py:ro" "$STACK/scrobbles.py:/app/scrobbles.py:ro"
    "$WORK_ROOT/mpd-listening-tools/data:/data")
ENTRYPOINT='["python3", "-u", "/app/bridge.py"]'
CMD='["--state", "/data", "--port", "18870", "--mpd-port", "6611"]'
BASE="http://127.0.0.1:$PORT"
python_safety_includes /usr/local/lib/python3.13

prepare() {
    mkdir -p "$WORK/data"
    cp -a "$STACK/data/sessions" "$STACK/data/mixes" "$WORK/data/"
    python3 -c 'import sqlite3,sys; s=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close()' \
        "$STACK/data/scrobbles.db" "$WORK/data/scrobbles.db"
    "$SCRIPT_DIR/tools/test-mpd.sh" start "$MPD_PORT" "$WORK" >/dev/null
}

cleanup() { "$SCRIPT_DIR/tools/test-mpd.sh" stop "$MPD_PORT"; }

wait_ready() { http_up "$BASE/"; }

# POST one action; prints the HTTP status, the action and the reply's keys
# (or its message with numbers masked, since counts change between runs).
act() {
    local label="$1" body="$2"
    curl -s --max-time 180 -H 'Content-Type: application/json' -d "$body" \
        -w '\n%{http_code}' "$BASE/" | python3 -c '
import json, re, sys
text, status = sys.stdin.read().rsplit("\n", 1)
try:
    reply = json.loads(text)
    shape = reply.get("message") if isinstance(reply.get("message"), str) else sorted(reply)
except ValueError:
    shape = "not JSON"
print(status, sys.argv[1], re.sub(r"[0-9]+", "N", str(shape)))' "$label"
}

requests() {
    act sessions '{"action": "sessions"}'
    act sources '{"action": "sources", "installed": ["SomaFM", "Pandora", "iBroadcast"]}'
    act handoff-status '{"action": "handoff-status"}'
    act scrobble-status '{"action": "scrobble-status"}'
    act choices-somafm '{"action": "choices", "provider": "somafm"}'
    act choices-ibroadcast '{"action": "choices", "provider": "ibroadcast"}'
    act save '{"action": "save", "name": "slimtest"}'
    act resume '{"action": "resume", "name": "slimtest"}'
    act mix '{"action": "mix", "name": "slimtest", "minutes": "60"}'
    act mix-deep '{"action": "mix", "name": "slimtest", "minutes": "90", "mode": "deep", "decade": "1980"}'
    act mix-unscrobbled '{"action": "mix", "name": "slimtest", "minutes": "60", "unscrobbled": "albums"}'
    act mix-locked '{"action": "mix", "name": "slimtest", "minutes": "60", "locks": "1"}'
    act queue '{"action": "queue", "name": "slimtest"}'
    act replace '{"action": "replace", "name": "slimtest"}'
    act handoff '{"action": "handoff", "name": "slimhandoff", "provider": "somafm", "item": "groovesalad"}'
    act bad-name '{"action": "save", "name": "../x"}'
    act unknown '{"action": "nope", "name": "x"}'
    curl -s -o /dev/null -w '%{http_code} POST with Origin\n' -H 'Origin: http://x' -d '{}' "$BASE/"
    # No "docker exec" runs here: the container only runs bridge.py, and
    # mint keeps files an exec'd process opens even from excluded mounts.
}

probe() {
    requests
    # The Last.fm history download (read-only for the account).
    act scrobble-sync '{"action": "scrobble-sync"}'
    sleep 20
    act scrobble-status '{"action": "scrobble-status"}'
}
check() { requests; }
