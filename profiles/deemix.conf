# deemix (in the aurral stack): Deezer downloader web app and API that
# aurral sends download jobs to. linuxserver-style image: s6-overlay init
# scripts, busybox cron, then Node.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/aurral"
SOURCE_IMAGE="ghcr.io/bambanah/deemix:latest"
SLIM_IMAGE="slim/deemix:latest"
NETWORK="bridge"
PORT=16595                          # live container uses 6595
PORTS=("127.0.0.1:$PORT:6595")
ENVS=(PUID=1000 PGID=1000 TZ=America/Chicago)
MOUNTS=("$WORK_ROOT/deemix/config:/config" "$WORK_ROOT/deemix/downloads:/downloads")
BASE="http://127.0.0.1:$PORT"
READY_TIMEOUT=180
# The s6 init and cron scripts call many small tools, some only now and
# then (log rotation, permission fixes); keep the init system, its
# scripts, the web UI's static files and a shell whole.
MINT_EXTRA=(--include-shell --include-path /package --include-path /command
    --include-path /etc/s6-overlay --include-path /init --include-path /docker-mods
    --include-path /custom-services.d --include-path /custom-cont-init.d
    --include-path /etc/periodic --include-path /etc/crontabs
    --include-path /etc/logrotate.conf --include-path /etc/logrotate.d
    --include-path /usr/bin/with-contenv --include-path /usr/bin/lsiown
    --include-path /app/packages/webui/dist/public --include-path /app/package.json
    --include-path /usr/share/zoneinfo
    --include-exe usermod --include-exe groupmod --include-exe logrotate
    --include-exe crond --include-exe run-parts --include-exe chown
    --include-exe find --include-exe stat --include-exe awk --include-exe sed)

# Config and login copied; the queue starts empty so no live download
# resumes here, and downloads land in the scratch folder.
prepare() {
    mkdir -p "$WORK/config/queue" "$WORK/downloads"
    cp -p "$STACK/data/deemix/config.json" "$STACK/data/deemix/login.json" "$WORK/config/"
    cp -a "$STACK/data/deemix/spotify" "$WORK/config/"
}

wait_ready() { http_up "$BASE/api/getSettings"; }

JAR=""
api() {
    local method="$1" path="$2" body="${3:-}"
    local args=(-s -b "$JAR" -c "$JAR" --max-time 60 -o "$WORK/reply.json" -w "%{http_code} $method $path\n")
    [[ "$method" == POST ]] && args+=(-H 'Content-Type: application/json' -d "$body")
    curl "${args[@]}" "$BASE/api$path"
}

requests() {
    JAR="$(mktemp)"
    local arl track album artist playlist uuid tries=0
    http_status "$BASE" /
    api GET /connect
    json_get 'sorted(d)' <"$WORK/reply.json"
    arl="$(json_get 'd["arl"]' <"$WORK/config/login.json")"
    api POST /loginArl "{\"arl\": \"$arl\", \"child\": 0}"
    json_get 'd.get("status")' <"$WORK/reply.json"
    api GET /getSettings
    json_get 'sorted(d)' <"$WORK/reply.json"
    api POST /saveSettings "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({"settings": d["settings"], "spotifySettings": d.get("spotifySettings", {})}))' "$WORK/reply.json")"
    api GET '/mainSearch?term=daft%20punk'
    track="$(json_get 'd["TRACK"]["data"][0]["SNG_ID"]' <"$WORK/reply.json")"
    album="$(json_get 'd["ALBUM"]["data"][0]["ALB_ID"]' <"$WORK/reply.json")"
    artist="$(json_get 'd["ARTIST"]["data"][0]["ART_ID"]' <"$WORK/reply.json")"
    playlist="$(json_get 'd["PLAYLIST"]["data"][0]["PLAYLIST_ID"]' <"$WORK/reply.json")"
    local type
    for type in track album artist playlist; do
        api GET "/search?term=daft%20punk&type=$type&start=0&nb=10"
    done
    api GET "/getTracklist?type=album&id=$album"
    api GET "/getTracklist?type=artist&id=$artist"
    api GET "/getTracklist?type=playlist&id=$playlist"
    api GET "/album-search/?term=discovery"
    api GET "/analyzeLink?term=https%3A%2F%2Fwww.deezer.com%2Ftrack%2F$track"
    api GET /getHome
    api GET /getCharts
    api GET '/getChartTracks?id=0'
    api GET /newReleases
    api GET /getUserFavorites
    api GET /getUserTracks
    api GET /getUserAlbums
    api GET /getUserArtists
    api GET /getUserPlaylists
    api GET /spotifyStatus
    # One real download (MP3 128, the stack's setting) into the scratch folder.
    api POST /addToQueue "{\"url\": \"https://www.deezer.com/track/$track\", \"bitrate\": \"1\"}"
    json_get 'd["result"]' <"$WORK/reply.json"
    until api GET /getQueue >/dev/null && json_get 'all(i.get("status") in ("completed", "withErrors", "failed") for i in d["queue"].values()) and len(d["queue"]) > 0' <"$WORK/reply.json" | grep -q True || ((++tries > 60)); do
        sleep 2
    done
    json_get 'sorted({i.get("status") for i in d["queue"].values()})' <"$WORK/reply.json"
    echo "mp3 files: $(find "$WORK/downloads" -name '*.mp3' | wc -l)"
    api POST /removeFinishedDownloads '{}'
    api POST /cancelAllDownloads '{}'
    api GET /getQueue
    json_get 'len(d["queue"])' <"$WORK/reply.json"
    api POST /logout '{}'
    http_status "$BASE" /nope
    rm -f "$JAR"
}

probe() {
    requests
    # Cron's periodic jobs (log rotation) run rarely; run them once now.
    docker exec "$CONTAINER" sh -c 'run-parts /etc/periodic/daily; run-parts /etc/periodic/15min; run-parts /etc/periodic/hourly' >/dev/null 2>&1 || true
}
check() { requests; }
