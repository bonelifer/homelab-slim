# download-check stack: scores aurral/deemix downloads against MusicBrainz
# with beets' matcher, serves a review page and hides non-passing folders
# from MPD (hold mode). The image holds only Python, beets and python-mpd2;
# the scripts come from the stack's ./scripts folder, mounted read-only.
#
# Tested on copies of up to three real download folders (a good album, one
# that needs a look, and a single-track folder, when the live results have
# them), a copy of aurral's database, and a fake MPD that answers the
# rescan requests with a refusal. The check asks the real MusicBrainz, so
# it needs network access. Gotify alerts are not tested: that code is
# plain urllib, and the stack keeps its standard library whole.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/download-check"
AURRAL_CONFIG="/home/william/Desktop/hl/dockhand/data/stacks/aurral/data/config"
DOWNLOADS="/home/william/Music/aurral"
SOURCE_IMAGE="download-check:local"
SLIM_IMAGE="slim/download-check:latest"
PULL_SOURCE=0       # built locally from the stack's Dockerfile
RUN_USER="1000:1000"
PORT=18872          # live container uses 18772
FAKE_MPD_PORT=16603 # holds ask "MPD" to rescan; a fake one refuses
READY_TIMEOUT=60
ENVS=(TZ=America/Chicago BEETSDIR=/config/check CHECK_MODE=hold
    CHECK_INTERVAL=30 SETTLE_MINUTES=0 "CHECK_WEB_PORT=$PORT"
    CHECK_WEB_LISTEN=127.0.0.1 AURRAL_DB=/aurral/aurral.db
    AURRAL_ROOT=/data/downloads/aurral "DOWNLOAD_ROOT=$DOWNLOADS"
    MPD_ROOT=/home/william/Music MPD_HOST=127.0.0.1
    "MPD_PORT=$FAKE_MPD_PORT")
# The folders are written to (.mpdignore files), so only copies are used.
MOUNTS=("$WORK_ROOT/download-check/config:/config/check"
    "$WORK_ROOT/download-check/music:$DOWNLOADS"
    "$WORK_ROOT/download-check/aurral:/aurral:ro"
    "$WORK_ROOT/download-check/scripts:/scripts:ro")
CMD='["/scripts/check-downloads.py", "watch"]'
BASE="http://127.0.0.1:$PORT"
SITE=/usr/local/lib/python3.12/site-packages
python_safety_includes /usr/local/lib/python3.12
# beets loads plugins by name; mutagen picks a format module per file type;
# unidecode loads its tables lazily; python-mpd2 is only used by holds.
MINT_EXTRA+=(--include-path "$SITE/beets" --include-path "$SITE/beetsplug"
    --include-path "$SITE/mutagen" --include-path "$SITE/mediafile.py"
    --include-path "$SITE/unidecode" --include-path "$SITE/mpd"
    --include-path /etc/ssl --include-path /usr/share/zoneinfo
    --exclude-pattern "/tmp/**")

# Print the folders to copy, relative to the download root, one per line:
# the smallest good album, the smallest one that needs a look and the
# smallest single-track folder found in the live results.
pick_samples() {
    python3 - "$STACK/data/state.json" "$DOWNLOADS" <<'PY'
import json, os, sys

state = json.load(open(sys.argv[1]))
root = sys.argv[2].rstrip("/") + "/"


def size(folder):
    return sum(f.stat().st_size for f in os.scandir(folder) if f.is_file())


groups = {"good": [], "flagged": [], "tracks": []}
for folder, result in state["folders"].items():
    if not folder.startswith(root) or not os.path.isdir(folder):
        continue
    distance = result.get("distance")
    if result.get("kind") == "tracks":
        key = "tracks"
    elif distance is not None and distance <= 0.15 and not result.get("reason"):
        key = "good"
    elif result.get("reason"):
        key = "flagged"
    else:
        continue
    groups[key].append((size(folder), folder))
for key in ("good", "flagged", "tracks"):
    if groups[key]:
        print(min(groups[key])[1][len(root):])
PY
}

prepare() {
    local rel
    mkdir -p "$WORK/config" "$WORK/music" "$WORK/aurral"
    cp -p "$STACK/data/config.yaml" "$WORK/config/config.yaml"
    cp -a "$STACK/scripts" "$WORK/scripts"
    rm -rf "$WORK/scripts/__pycache__"
    pick_samples >"$WORK_ROOT/$PROFILE.samples"
    if [[ ! -s "$WORK_ROOT/$PROFILE.samples" ]]; then
        echo "No usable download folders in the live results." >&2
        return 1
    fi
    while IFS= read -r rel; do
        mkdir -p "$WORK/music/$(dirname "$rel")"
        cp -a "$DOWNLOADS/$rel" "$WORK/music/$rel"
        # A real .mpdignore from an earlier hold is not part of the test.
        rm -f "$WORK/music/$rel/.mpdignore"
    done <"$WORK_ROOT/$PROFILE.samples"
    # A consistent copy of aurral's database (it may be mid-write).
    python3 -c 'import sqlite3,sys; s=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close()' \
        "$AURRAL_CONFIG/aurral.db" "$WORK/aurral/aurral.db"
    python3 -c 'import json,sys; json.dump([{"seconds": 1, "status": {"state": "stop"}, "song": {}}], open(sys.argv[1], "w"))' "$WORK/mpd.json"
    python3 "$SCRIPT_DIR/tools/fake-mpd.py" -p "$FAKE_MPD_PORT" -s "$WORK/mpd.json" &
    echo $! >"$WORK_ROOT/$PROFILE.fake.pid"
}

cleanup() {
    if [[ -f "$WORK_ROOT/$PROFILE.fake.pid" ]]; then
        kill "$(cat "$WORK_ROOT/$PROFILE.fake.pid")" 2>/dev/null || true
        rm -f "$WORK_ROOT/$PROFILE.fake.pid"
    fi
}

wait_ready() { http_up "$BASE/"; }

# URL-encode one query value.
enc() {
    python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1"
}

TOKEN=""
post() {
    local path="$1"
    shift
    local data=(--data-urlencode "token=$TOKEN")
    local field
    for field in "$@"; do data+=(--data-urlencode "$field"); done
    curl -s -o /dev/null -w "%{http_code} POST $path\n" --max-time 300 "${data[@]}" "$BASE$path"
}

# Wait for the first pass: the overview says "not yet" until it ends.
wait_first_pass() {
    local tries=0
    while http_body "$BASE" / | grep -q 'Last check: not yet' && ((++tries < 150)); do
        sleep 2
    done
}

# The first audio file name in a copied folder.
first_audio() {
    find "$WORK/music/$1" -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.flac' -o -name '*.m4a' \
        -o -name '*.ogg' -o -name '*.opus' \) -printf '%f\n' | sort | head -n 1
}

requests() {
    local filter rel track samples=()
    mapfile -t samples <"$WORK_ROOT/$PROFILE.samples"
    wait_first_pass
    TOKEN="$(http_body "$BASE" / | grep -o 'name="token" value="[^"]*"' | head -n 1 | sed 's/.*value="//; s/"$//')"
    http_status "$BASE" /
    for filter in flagged held review fail approved pass all bogus; do
        http_status "$BASE" "/list?filter=$filter"
    done
    http_status "$BASE" /player.js
    http_status "$BASE" /nope
    http_status "$BASE" '/folder?f=..%2F..%2Fetc'
    for rel in "${samples[@]}"; do
        http_status "$BASE" "/folder?f=$(enc "$rel")"
        track="$(first_audio "$rel")"
        [[ -n "$track" ]] || continue
        http_status "$BASE" "/audio?f=$(enc "$rel")&n=$(enc "$track")"
        curl -s -o /dev/null -r 0-99 -w "%{http_code} ranged /audio\n" "$BASE/audio?f=$(enc "$rel")&n=$(enc "$track")"
    done
    post /theme theme=dark back=/list
    post /theme theme=bogus back=//evil
    for rel in "${samples[@]}"; do
        post /recheck "f=$rel"
    done
    post /approve "f=${samples[0]}"
    curl -s -o /dev/null -w '%{http_code} POST bad token\n' -d 'token=x' "$BASE/approve"
    docker exec "$CONTAINER" /scripts/check-downloads.py run 2>&1 | grep -c 'checked' | sed 's/^/second pass lines: /' || true
    docker exec "$CONTAINER" /scripts/check-downloads.py status | grep -c '^## ' | sed 's/^/report entries: /' || true
    docker exec "$CONTAINER" /scripts/check-downloads.py approve "${samples[-1]}" | sed 's/^Approved .*\. If/Approved. If/' || true
    docker exec "$CONTAINER" /scripts/check-downloads.py approve /nowhere 2>&1 | head -n 1 | sed 's/ under .*//' || true
    docker exec "$CONTAINER" /scripts/check-downloads.py --help | head -n 1
}

probe() { requests; }

# The result of each copied folder, written by the app, plus which folders
# are held and how the log looks.
check() {
    requests
    python3 - "$WORK/config/reports/latest.json" <<'PY'
import json, sys

for r in sorted(json.load(open(sys.argv[1]))["results"], key=lambda r: r["folder"]):
    print(r["folder"].split("/aurral/", 1)[-1], r["kind"], r["status"], r["reason"])
PY
    find "$WORK/music" -name .mpdignore -printf '%P\n' | sort | sed 's/^/held: /'
    echo "mpd-missing lines: $(docker logs "$CONTAINER" 2>&1 | grep -c 'python-mpd2 is missing' || true)"
    echo "rescan tried: $(docker logs "$CONTAINER" 2>&1 | grep -c 'MPD rescan failed' | sed 's/^[1-9][0-9]*$/yes/')"
}
