# pandora stack: Pandora stations bridge for myMPD (pydora + ffmpeg).
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/pandora"
SOURCE_IMAGE="ghcr.io/bonelifer/mympd-pandora:latest"
SLIM_IMAGE="slim/mympd-pandora:latest"
RUN_USER="1000:1000"
PORT=18865   # live container uses 18765
MOUNTS=("$WORK_ROOT/pandora/pydora.cfg:/config/pydora.cfg:ro")
CMD='["--listen", "127.0.0.1", "--port", "18865"]'
BASE="http://127.0.0.1:$PORT"
python_safety_includes /usr/local/lib/python3.11
# pydora and requests are small; keep them whole so rarely used API
# calls (station edits, feedback) still import everything they need.
MINT_EXTRA+=(--include-path /usr/local/lib/python3.11/site-packages/pandora
    --include-path /usr/local/lib/python3.11/site-packages/requests
    --include-path /usr/local/lib/python3.11/site-packages/urllib3
    --include-path /usr/local/lib/python3.11/site-packages/certifi
    --include-path /usr/local/lib/python3.11/site-packages/charset_normalizer
    --include-path /usr/local/lib/python3.11/site-packages/idna
    --include-bin /usr/bin/ffmpeg --include-bin /usr/bin/ffprobe)

prepare() { cp -p "$STACK/data/pydora.cfg" "$WORK/pydora.cfg"; }
wait_ready() { http_up "$BASE/"; }

# POST /manage/<action> with the session token; prints "<status> manage <action>".
manage() {
    local action="$1" body="$2" token
    token="$(http_body "$BASE" /manage | json_get 'd["token"]')"
    curl -s -o "$WORK/manage.json" -w "%{http_code} manage $action\n" -X POST \
        -H 'Content-Type: application/json' --max-time 60 \
        -d "{\"token\": \"$token\"$body}" "$BASE/manage/$action"
}

# Only read-only Pandora calls run here: station edits, ratings and
# "tired" would change the real account. A 20-second stream exercises
# pydora's playlist code and ffmpeg's decode + MP3 encode path.
requests() {
    local station
    http_status "$BASE" /stations
    http_body "$BASE" /stations | json_get '(len(d) > 0, sorted(d[0]))'
    station="$(http_body "$BASE" /stations | json_get 'd[0]["id"]')"
    http_status "$BASE" /manage
    manage list ''
    json_get 'sorted(d[0])' <"$WORK/manage.json"
    manage search ', "query": "beatles"'
    manage details ", \"station\": \"$station\""
    json_get 'sorted(d)' <"$WORK/manage.json"
    manage rename ', "station": "no-such-station", "name": "x"'
    curl -s -o /dev/null -w '%{http_code} manage bad token\n' -X POST \
        -d '{"token": "x"}' "$BASE/manage/list"
    # Stream with ICY metadata in the background, then read the controls.
    curl -s -H 'Icy-MetaData: 1' --max-time 20 -o "$WORK/stream.mp3" \
        -D "$WORK/stream.headers" "$BASE/stream/$station" &
    local stream_pid=$! tries=0
    until http_body "$BASE" "/controls/$station" | grep -q '"id"' || ((++tries > 15)); do
        sleep 1
    done
    http_status "$BASE" "/controls/$station"
    local nonce
    nonce="$(http_body "$BASE" "/controls/$station" | json_get 'd["id"]')"
    curl -s -o "$WORK/explain.json" -w '%{http_code} controls explain\n' -X POST \
        "$BASE/controls/$station/explain?track=$nonce"
    curl -s -o /dev/null -w '%{http_code} controls stale nonce\n' -X POST \
        "$BASE/controls/$station/skip?track=stale"
    wait "$stream_pid" || true
    grep -m1 -o 'audio/mpeg' "$WORK/stream.headers"
    python3 -c 'import os,sys; n=os.path.getsize(sys.argv[1]); print("stream bytes > 100k", n > 100000)' "$WORK/stream.mp3"
    http_status "$BASE" /stream/no-such-station
    http_status "$BASE" /nope
}

probe() { requests; }
check() { requests; }
