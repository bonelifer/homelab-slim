# tunein stack: TuneIn favorites bridge for myMPD.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/tunein"
SOURCE_IMAGE="ghcr.io/bonelifer/mympd-tunein:latest"
SLIM_IMAGE="slim/mympd-tunein:latest"
RUN_USER="1000:1000"
PORT=18866   # live container uses 18766
MOUNTS=("$WORK_ROOT/tunein/tunein.cfg:/config/tunein.cfg:ro"
    "$WORK_ROOT/tunein/artwork:/artwork"
    "$WORK_ROOT/tunein/scan:/scan:ro")
CMD='["--listen", "127.0.0.1", "--port", "18866", "--artwork-dir", "/artwork", "--scan-report", "/scan/tunein-scan.json"]'
BASE="http://127.0.0.1:$PORT"
python_safety_includes /usr/local/lib/python3.11

prepare() {
    mkdir -p "$WORK/artwork" "$WORK/scan"
    cp -p "$STACK/data/tunein.cfg" "$WORK/tunein.cfg"
    cp -p "$STACK/../mympd-radio-scrobble/data/tunein-scan.json" "$WORK/scan/"
}
wait_ready() { http_up "$BASE/"; }

# Favorite changes would edit the real account, so only the refusal
# paths of POST /favorites run here; they share the same client code.
requests() {
    http_status "$BASE" /stations
    local first
    http_body "$BASE" /stations | json_get '(len(d) > 0, sorted(d[0]))'
    first="$(http_body "$BASE" /stations | json_get 'd[0]["id"]')"
    http_status "$BASE" "/stations/$first"
    http_body "$BASE" "/stations/$first" | json_get 'sorted(d)'
    find "$WORK/artwork" -type f -printf '%f\n' | sort | sed 's/.*\./artwork ./' | sort -u
    http_status "$BASE" '/search?q=jazz'
    http_status "$BASE" '/search?q='
    http_status "$BASE" /locations/r0
    curl -s -o /dev/null -w '%{http_code} POST with Origin\n' -X POST \
        -H 'Content-Type: application/json' -H 'Origin: http://x' "$BASE/favorites/add/s1"
    curl -s -o /dev/null -w '%{http_code} POST unknown\n' -X POST "$BASE/favorites/zap/s1"
    http_status "$BASE" /nope
}

probe() {
    requests
    # Resolve every favorite once so each stream type's parser runs.
    local id
    for id in $(http_body "$BASE" /stations | json_get '" ".join(s["id"] for s in d)'); do
        http_status "$BASE" "/stations/$id"
    done
}
check() { requests; }
