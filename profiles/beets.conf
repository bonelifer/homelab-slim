# beets stack: read-only music database (mpdstats service + nightly job
# that imports, analyzes BPM/key and writes reports and the JSON export).
# Tested on a fresh library of a few copied files, mounted at the real
# music paths, with a throwaway MPD; the live database is never used.
# shellcheck shell=bash disable=SC2034

STACK="/home/william/Desktop/hl/dockhand/data/stacks/beets"
MUSIC="/home/william/Music"
SOURCE_IMAGE="beets-local:2.14.1"
SLIM_IMAGE="slim/beets:2.14.1"
PULL_SOURCE=0      # built locally from the stack's Dockerfile
RUN_USER="1000:1000"
MPD_PORT=6613      # throwaway MPD for mpdstats
READY_TIMEOUT=60
ENVS=(TZ=America/Chicago RUN_AT=03:30)
MOUNTS=("$WORK_ROOT/beets/config:/config"
    "$WORK_ROOT/beets/music/library:$MUSIC/library:ro"
    "$WORK_ROOT/beets/music/aurral:$MUSIC/aurral:ro")
CMD='["beet", "mpdstats"]'
SITE=/usr/local/lib/python3.12/site-packages
# beets loads plugins by name and librosa loads its submodules lazily;
# numba/llvmlite compile at run time. Keep those packages whole.
MINT_EXTRA=(--include-path "$SITE/beets" --include-path "$SITE/beetsplug"
    --include-path "$SITE/numba" --include-path "$SITE/llvmlite"
    --include-path "$SITE/librosa" --include-path "$SITE/lazy_loader"
    --include-path "$SITE/resampy" --include-path "$SITE/soundfile.py"
    --include-path "$SITE/_soundfile_data" --include-path "$SITE/audioread"
    --include-path "$SITE/mpd" --include-path /opt/keyfinder
    --include-path /usr/share/zoneinfo --include-shell
    --include-exe date --include-exe mv --include-exe mkdir --include-exe sleep
    --include-bin /usr/bin/ffmpeg --include-bin /usr/bin/ffprobe
    --exclude-pattern "/tmp/**")
SAMPLES=("library/Zedd/The Middle (2018)" "library/Kris Kristofferson/Kristofferson (2010)/CD 1")

# Only after the first full analysis pass: the live nightly job must have
# logged "=== finished" after the 11/16/2026 22:17 UTC run started.
first_pass_done() {
    awk '/=== nightly run/ {started = ($1 >= "2026-11-16T22:17")} started && /=== finished/ {done = 1} END {exit !done}' \
        "$STACK/data/config/nightly.log"
}

prepare() {
    if ! first_pass_done; then
        echo "beets' first analysis pass has not finished; try again later." >&2
        return 1
    fi
    local sample
    mkdir -p "$WORK/config" "$WORK/music/library" "$WORK/music/aurral"
    for sample in "${SAMPLES[@]}"; do
        mkdir -p "$WORK/music/$(dirname "$sample")"
        cp -a "$MUSIC/$sample" "$WORK/music/$sample"
    done
    # One aurral-side file so both import folders have music.
    find "$WORK/music/library/Zedd" -name '*.mp3' -exec cp -p {} "$WORK/music/aurral/" \; -quit
    # The stack's config, pointed at the throwaway MPD; a fresh database.
    sed -e "s/^    port: 6600$/    port: $MPD_PORT/" "$STACK/data/config/config.yaml" >"$WORK/config/config.yaml"
    "$SCRIPT_DIR/tools/test-mpd.sh" start "$MPD_PORT" "$WORK" >/dev/null
}

cleanup() { "$SCRIPT_DIR/tools/test-mpd.sh" stop "$MPD_PORT"; }

wait_ready() { docker logs "$CONTAINER" 2>&1 | grep -q . || sleep 3; }

beet() { docker exec -e NUMBA_CACHE_DIR=/tmp/numba "$CONTAINER" beet "$@"; }

# The nightly job, fed through stdin so its mounted file is never opened
# inside the container; stopped once its first run has finished.
nightly() {
    docker exec -i -e RUN_AT=03:30 "$CONTAINER" bash -s <"$STACK/scripts/nightly.sh" >/dev/null 2>&1 &
    local pid=$! tries=0
    until grep -q '=== finished' "$WORK/config/nightly.log" 2>/dev/null || ((++tries > 600)); do
        sleep 2
    done
    kill "$pid" 2>/dev/null || true
    grep -E '=== |FAILED' "$WORK/config/nightly.log" | sed 's/^[^ ]* //'
}

requests() {
    beet version | head -n 1
    beet config | grep -c . | sed 's/^/config lines: /'
    nightly
    beet update >/dev/null && echo "update ok"
    beet autobpm -f >/dev/null && echo "autobpm -f ok"
    beet keyfinder >/dev/null && echo "keyfinder ok"
    # shellcheck disable=SC2016  # a beets format string, not shell
    beet ls -f '$title|$bpm|$initial_key|$format'
    beet missing | wc -l | sed 's/^/missing lines: /'
    beet duplicates | wc -l | sed 's/^/duplicate lines: /'
    beet export -l -f jsonlines -i 'path,title,artist,album,bpm,initial_key,format,length' |
        python3 -c 'import json,sys; [print(json.dumps(json.loads(l), sort_keys=True)) for l in sys.stdin]' | sort
    beet info "$MUSIC/library/Zedd" | grep -c . | sed 's/^/info lines: /'
    echo "mpdstats error lines: $(docker logs "$CONTAINER" 2>&1 | grep -ciE 'traceback|error' || true)"
}

probe() { requests; }
check() { requests; }
