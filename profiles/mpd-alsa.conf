# mpd-alsa stack: the MPD server (PulseAudio output + lame HTTP stream).
# Tested as a second MPD on spare ports with copies of the database,
# state, stickers and playlists; music is read-only.
# shellcheck shell=bash disable=SC2034

STACK="/home/william/Desktop/hl/dockhand/data/stacks/mpd-alsa"
MUSIC="/home/william/Music"
SOURCE_IMAGE="giof71/mpd-alsa:latest"
SLIM_IMAGE="slim/mpd-alsa:latest"
MPD_PORT=6612      # live MPD uses 6600
STREAM_PORT=8012   # live HTTP stream uses 8000
READY_TIMEOUT=180
# The stack's environment, with only ports and the stream address changed.
ENVS=(HTTPD_OUTPUT_ENCODER=lame AUTO_UPDATE=no REPLAYGAIN_MODE=track
    HTTPD_OUTPUT_MIXER_TYPE=software PUID=1000 PGID=1000 ENFORCE_PLAYER_STATE=no
    HTTPD_OUTPUT_ENABLED=yes HTTPD_OUTPUT_TAGS=yes "MPD_PORT=$MPD_PORT"
    MPD_BIND_ADDRESS=127.0.0.1 HTTPD_OUTPUT_BIND_TO_ADDRESS=127.0.0.1
    "HTTPD_OUTPUT_PORT=$STREAM_PORT" "HTTPD_OUTPUT_NAME=HTTP Stream"
    HTTPD_OUTPUT_CREATE=yes HTTPD_OUTPUT_MAX_CLIENTS=0 HTTPD_OUTPUT_ALWAYS_ON=yes
    HTTPD_OUTPUT_FORMAT=44100:16:2 PULSE_AUDIO_OUTPUT_CREATE=yes
    HTTPD_OUTPUT_ENCODER_BITRATE=320 MAX_OUTPUT_BUFFER_SIZE=32768
    # Test-only differences: the PulseAudio output exists but stays off
    # (its mixer cannot be muted before playback starts, so the test never
    # plays through the real sound path); a null output plays instead.
    PULSE_AUDIO_OUTPUT_ENABLED=no NULL_OUTPUT_CREATE=yes NULL_OUTPUT_NAME=null)
MOUNTS=("$WORK_ROOT/mpd-alsa/config:/user/config" "$WORK_ROOT/mpd-alsa/db:/db"
    "$WORK_ROOT/mpd-alsa/log:/log" "$MUSIC:/music:ro"
    "$WORK_ROOT/mpd-alsa/playlists:/playlists"
    "/run/user/1000/pulse:/run/user/1000/pulse")
# The start scripts build mpd.conf from the environment with shell tools,
# and MPD and its libraries load ALSA/PulseAudio plugins, character set
# converters and config files only when an output or tag needs them.
# Keep those whole so other settings still work later.
MINT_EXTRA=(--include-shell --include-path /app --include-path /usr/bin
    --include-path /bin --include-path /usr/sbin --include-path /etc
    --include-path /usr/share/alsa --include-path /usr/lib/x86_64-linux-gnu/alsa-lib
    --include-path /usr/lib/x86_64-linux-gnu/gconv
    --include-path /usr/share/zoneinfo --include-path /usr/share/ca-certificates
    --include-path /usr/lib/locale --include-path /usr/share/soundfonts
    --include-path /usr/lib/x86_64-linux-gnu/pulseaudio --include-path /etc/pulse
    --include-path /usr/lib/x86_64-linux-gnu/gio)

prepare() {
    mkdir -p "$WORK/config" "$WORK/db" "$WORK/log" "$WORK/playlists"
    cp -p "$STACK/data/db/tag_cache" "$STACK/data/db/sticker" "$STACK/data/db/state" "$WORK/db/"
    cp -p "$STACK/data/playlists/"*.m3u "$WORK/playlists/"
    # Start stopped with an empty queue; never resume what the live MPD plays.
    sed -i -e 's/^state: .*/state: stop/' "$WORK/db/state"
}

wait_ready() {
    python3 -c 'import socket,sys; s=socket.create_connection(("127.0.0.1", int(sys.argv[1])), 2); sys.exit(0 if s.recv(64).startswith(b"OK MPD") else 1)' "$MPD_PORT" 2>/dev/null
}

requests() {
    python3 "$SCRIPT_DIR/profiles/mpd-alsa-probe.py" --port "$MPD_PORT" \
        --stream-port "$STREAM_PORT" --music "$MUSIC"
}
probe() { requests; }
check() { requests; }
