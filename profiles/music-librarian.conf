# music-librarian stack: genre review, tag cleanup and lyrics web app.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/music-librarian"
LIBRARY="/home/william/Music/library"
SOURCE_IMAGE="ghcr.io/bonelifer/music-librarian:latest"
SLIM_IMAGE="slim/music-librarian:latest"
RUN_USER="1000:1000"
PORT=18871          # live container uses 18771
FAKE_MPD_PORT=16602 # tag writes ask "MPD" to rescan; a fake one answers
ENV_FILE="$STACK/.env"
ENVS=(TZ=America/Chicago LIBRARY_DIR=/library STATE_DIR=/state
    LISTEN=127.0.0.1 "PORT=$PORT" MPD_HOST=127.0.0.1 "MPD_PORT=$FAKE_MPD_PORT"
    MPD_PATH_PREFIX=library SCAN_INTERVAL_MINUTES=60 LYRICS_AUTO_FILL=1
    DEEZER_LYRICS=1 DEEZER_ARL_FILE=/deemix/.arl)
# The app writes into the library, so it only ever sees copied albums.
MOUNTS=("$WORK_ROOT/music-librarian/library:/library"
    "$WORK_ROOT/music-librarian/state:/state"
    "$WORK_ROOT/music-librarian/deemix:/deemix:ro")
CMD='["serve"]'
BASE="http://127.0.0.1:$PORT"
# Sample albums (relative to the library): MP3 and the one M4A album.
ALBUMS=("Zedd/The Middle (2018)" "Kris Kristofferson/Kristofferson (2010)/CD 1")
python_safety_includes /usr/local/lib/python3.13
# mutagen picks a format module per file type; keep all of it.
MINT_EXTRA+=(--include-path /usr/local/lib/python3.13/site-packages/mutagen)

prepare() {
    local album
    mkdir -p "$WORK/library" "$WORK/state" "$WORK/deemix"
    for album in "${ALBUMS[@]}"; do
        mkdir -p "$WORK/library/$(dirname "$album")"
        cp -a "$LIBRARY/$album" "$WORK/library/$album"
    done
    # A consistent copy of the live database (it may be mid-write).
    python3 -c 'import sqlite3,sys; s=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close()' \
        "$STACK/data/music-librarian.db" "$WORK/state/music-librarian.db"
    cp -p /home/william/.config/deemix/.arl "$WORK/deemix/.arl"
    python3 -c 'import json,sys; json.dump([{"seconds": 1, "status": {"state": "stop"}, "song": {}}], open(sys.argv[1], "w"))' "$WORK/mpd.json"
    python3 "$SCRIPT_DIR/tools/fake-mpd.py" -p "$FAKE_MPD_PORT" -s "$WORK/mpd.json" &
    echo $! >"$WORK_ROOT/$PROFILE.fake.pid"
}

cleanup() {
    if [[ -f "$WORK_ROOT/$PROFILE.fake.pid" ]]; then
        kill "$(cat "$WORK_ROOT/$PROFILE.fake.pid")" 2>/dev/null || true
        rm -f "$WORK_ROOT/$PROFILE.fake.pid"
    fi
}

wait_ready() { http_up "$BASE/"; }

TOKEN=""
post() {
    local path="$1"
    shift
    local data=(--data-urlencode "token=$TOKEN")
    local field
    for field in "$@"; do data+=(--data-urlencode "$field"); done
    curl -s -o /dev/null -w "%{http_code} POST $path\n" --max-time 120 "${data[@]}" "$BASE$path"
}

# Album ID for a sample folder, read from the scratch database.
album_id() {
    python3 -c 'import sqlite3,sys; c=sqlite3.connect(f"file:{sys.argv[1]}?immutable=1", uri=True); print(c.execute("SELECT id FROM albums WHERE folder = ? OR folder = ?", (sys.argv[2], "library/" + sys.argv[2])).fetchone()[0])' \
        "$WORK/state/music-librarian.db" "$1"
}

# Wait until a page no longer mentions a running job (max 3 minutes).
wait_idle() {
    local page="$1" pattern="$2" tries=0
    while http_body "$BASE" "$page" | grep -qiE "$pattern" && ((++tries < 90)); do
        sleep 2
    done
}

requests() {
    local filter id
    TOKEN="$(http_body "$BASE" / | sed -n 's/.*name="token" value="\([^"]*\)".*/\1/p' | head -n 1)"
    http_status "$BASE" /
    for filter in pending changed nosuggest applied skipped ignored; do
        http_status "$BASE" "/albums?filter=$filter"
    done
    http_status "$BASE" '/albums?filter=pending&page=2&tick=all'
    http_status "$BASE" /next
    http_status "$BASE" /bulk
    http_status "$BASE" /tags
    http_status "$BASE" '/tags/field?name=comment'
    http_status "$BASE" /lyrics
    http_status "$BASE" /nope
    post /theme theme=dark back=/tags
    post /scan
    sleep 5
    wait_idle / 'Last scan: (running|scanning)'
    id="$(album_id "${ALBUMS[0]}")"
    http_status "$BASE" "/album/$id"
    post "/album/$id/apply" genre=Electronic genre=Pop extra=Dance
    post "/album/$id/revert"
    post "/album/$id/restore-tags"
    post "/album/$id/skip"
    post "/album/$id/unignore"
    post /approve filter=skipped page=1
    post /bulk
    post /tags/rules field=comment
    post /tags/apply
    wait_idle /tags 'running|working'
    post /tags/restore field=comment
    wait_idle /tags 'running|working'
    post /tags/rules
    post /tags/auto enabled=0
    post /lyrics/fill
    sleep 3
    wait_idle /lyrics 'Stop looking up'
    post /lyrics/stop
    post /lyrics/remove
    curl -s -o /dev/null -w '%{http_code} POST bad token\n' -d 'token=x' "$BASE/scan"
    docker exec "$CONTAINER" python3 /app/music_librarian.py scan
    docker exec "$CONTAINER" python3 /app/music_librarian.py suggest -n 2 | sed 's/[0-9]\+/N/g'
    docker exec "$CONTAINER" python3 /app/music_librarian.py --help | head -n 1
}

probe() {
    requests
    # Deleting written lyrics walks every file the copied database lists,
    # which is slow on the sample library; run it here only, not in check.
    post /lyrics/remove confirm=yes
}
check() {
    requests
    # Lyrics files and tags written into the copies are part of the result.
    find "$WORK/library" -type f | sed 's/.*\.//' | sort | uniq -c
}
