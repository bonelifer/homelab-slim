# ibroadcast stack: iBroadcast library bridge for myMPD.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/ibroadcast"
SOURCE_IMAGE="ghcr.io/bonelifer/mympd-ibroadcast:latest"
SLIM_IMAGE="slim/mympd-ibroadcast:latest"
RUN_USER="1000:1000"
PORT=18869   # live container uses 18769
ENV_FILE="$STACK/.env"
ENVS=(TZ=America/Chicago MYMPD_THUMBS_DIR=/thumbs
    "MYMPD_STREAM_ORIGIN=http://127.0.0.1:$PORT")
MOUNTS=("$WORK_ROOT/ibroadcast/state:/state" "$WORK_ROOT/ibroadcast/thumbs:/thumbs")
CMD='["serve", "--token-file", "/state/token.json", "--port", "18869"]'
BASE="http://127.0.0.1:$PORT"

# iBroadcast rotates refresh tokens: if this copy refreshed, the live
# bridge's login would stop working. Only test while the copied access
# token has at least 20 minutes left, so the copy never refreshes.
prepare() {
    mkdir -p "$WORK/state" "$WORK/thumbs"
    cp -p "$STACK/data/token.json" "$WORK/state/token.json"
    local left
    left="$(json_get 'int(d["expires_at"] - __import__("time").time())' <"$WORK/state/token.json")"
    if ((left < 1200)); then
        echo "Access token expires in ${left}s; wait for the live bridge to refresh it, then retry." >&2
        return 1
    fi
}
wait_ready() { http_up "$BASE/health"; }

# Print first IDs used by the deeper requests.
ids() {
    ARTIST="$(http_body "$BASE" /artists | json_get 'd[0]["id"]')"
    ALBUM="$(http_body "$BASE" "/albums/$ARTIST" | json_get 'd[0]["id"]')"
    TRACK="$(http_body "$BASE" "/tracks/$ALBUM" | json_get 'd[0]["id"]')"
}

requests() {
    http_status "$BASE" /health
    http_body "$BASE" /health | json_get 'd["auth"]'
    http_status "$BASE" /artists
    http_body "$BASE" '/artists?offset=0' | json_get 'sorted(d)'
    http_status "$BASE" '/artists?offset=75'
    http_status "$BASE" /albums
    ids
    http_status "$BASE" "/albums/$ARTIST"
    http_status "$BASE" "/tracks/$ALBUM"
    local mode
    for mode in genre year tag playlist recent rated played; do
        http_status "$BASE" "/browse?mode=$mode"
    done
    http_status "$BASE" '/browse?mode=search&value=love'
    http_status "$BASE" '/browse?mode=random&value=5'
    http_status "$BASE" '/browse?mode=bogus'
    curl -s -o /dev/null -w '%{http_code} stream %header{content-type}\n' \
        -H 'Range: bytes=0-65535' --max-time 60 "$BASE/stream/$TRACK"
    find "$WORK/thumbs" -type f -printf '%f\n' | sort | sed 's/.*\./cover ./'
    curl -s -o /dev/null -w '%{http_code} POST bad body\n' -X POST \
        -H 'Content-Type: application/json' -d '{"name": ""}' "$BASE/playlists"
    curl -s -o /dev/null -w '%{http_code} POST with Origin\n' -X POST \
        -H 'Origin: http://x' "$BASE/playlists"
    http_status "$BASE" /nope
}

probe() { requests; }
check() { requests; }
