# iheart stack: iHeartRadio stations and podcasts bridge for myMPD.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"
source "$SCRIPT_DIR/profiles/lib-python.sh"

STACK="/home/william/Desktop/hl/dockhand/data/stacks/iheart"
SOURCE_IMAGE="ghcr.io/bonelifer/mympd-iheart:latest"
SLIM_IMAGE="slim/mympd-iheart:latest"
RUN_USER="1000:1000"
PORT=18867   # live container uses 18767
MOUNTS=("$WORK_ROOT/iheart/test-account.json:/config/test-account.json:ro"
    "$WORK_ROOT/iheart/artwork:/artwork")
CMD='["--listen", "127.0.0.1", "--port", "18867", "--artwork-dir", "/artwork"]'
BASE="http://127.0.0.1:$PORT"
python_safety_includes /usr/local/lib/python3.11

prepare() {
    mkdir -p "$WORK/artwork"
    cp -p "$STACK/data/test-account.json" "$WORK/test-account.json"
}
wait_ready() { http_up "$BASE/"; }

# Saving a favorite would edit the real account, so only the refusal
# paths of POST /favorites run here.
requests() {
    local first podcast ep
    http_status "$BASE" /stations
    http_body "$BASE" /stations | json_get '(len(d) > 0, sorted(d[0]))'
    first="$(http_body "$BASE" /stations | json_get 'd[0]["id"]')"
    http_status "$BASE" "/stations/$first"
    http_body "$BASE" "/stations/$first" | json_get 'sorted(d)'
    find "$WORK/artwork" -type f -printf '%f\n' | sort | sed 's/.*\./artwork ./' | sort -u
    http_status "$BASE" '/search?q=wgn'
    http_status "$BASE" '/search?q='
    http_status "$BASE" '/podcasts?q=history'
    podcast="$(http_body "$BASE" '/podcasts?q=history' | json_get 'd[0]["id"]')"
    http_status "$BASE" "/podcasts/$podcast"
    ep="$(http_body "$BASE" "/podcasts/$podcast" | json_get 'd[0]["id"]')"
    http_status "$BASE" "/episodes/$ep"
    curl -s -o /dev/null -w '%{http_code} POST with Origin\n' -X POST \
        -H 'Content-Type: application/json' -H 'Origin: http://x' "$BASE/favorites/1"
    curl -s -o /dev/null -w '%{http_code} POST unknown\n' -X POST "$BASE/nope"
    http_status "$BASE" /nope
}

probe() {
    requests
    local id
    for id in $(http_body "$BASE" /stations | json_get '" ".join(str(s["id"]) for s in d)'); do
        http_status "$BASE" "/stations/$id"
    done
    docker exec "$CONTAINER" python account.py --help >/dev/null
}
check() {
    requests
    docker exec "$CONTAINER" python account.py --help | head -n 1
}
