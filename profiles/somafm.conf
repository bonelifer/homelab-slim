# somafm stack: SomaFM lineup bridge for the myMPD picker.
# shellcheck shell=bash disable=SC2034
source "$SCRIPT_DIR/profiles/lib-http.sh"

SOURCE_IMAGE="ghcr.io/bonelifer/mympd-somafm:latest"
SLIM_IMAGE="slim/mympd-somafm:latest"
RUN_USER="1000:1000"
PORT=18868   # live container uses 18768
ENVS=(TZ=America/Chicago MYMPD_THUMBS_DIR=/thumbs)
MOUNTS=("$WORK_ROOT/somafm/thumbs:/thumbs")
CMD='["--listen", "127.0.0.1", "--port", "18868"]'
BASE="http://127.0.0.1:$PORT"

prepare() { mkdir -p "$WORK/thumbs"; }
wait_ready() { http_up "$BASE/"; }

probe() {
    http_status "$BASE" /stations
    http_status "$BASE" /stations/groovesalad   # resolve + cover download
    http_status "$BASE" /recent/groovesalad
    http_status "$BASE" /nope
}

check() {
    http_status "$BASE" /stations
    http_body "$BASE" /stations | python3 -c 'import json,sys; d=json.load(sys.stdin); print("stations", len(d) > 10, sorted(d[0]))'
    http_status "$BASE" /stations/groovesalad
    http_body "$BASE" /stations/groovesalad | python3 -c 'import json,sys; print("resolve", json.load(sys.stdin)["url"].startswith("https://"))'
    find "$WORK/thumbs" -type f -printf '%f\n' | sort | sed 's/^/cover /'
    http_status "$BASE" /recent/groovesalad
    http_status "$BASE" /nope
}
