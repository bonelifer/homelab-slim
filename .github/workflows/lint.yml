name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck, flake8, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: shellcheck
        run: shellcheck -s bash -e SC2154,SC2034,SC1091 slim-image.sh tools/test-mpd.sh profiles/*.conf profiles/*.sh
      - name: flake8
        run: python -m pip install flake8 && python -m flake8 --max-line-length 100 tools/*.py profiles/*.py tests/*.py
      - name: Offline tests
        run: python -m unittest discover -s tests -v
